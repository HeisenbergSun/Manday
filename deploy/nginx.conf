# Manday Nginx（应用机）：TLS 终止 + /api /ai 反代 + WS 升级
server {
    listen 443 ssl;
    server_name manday.internal.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;   # HSTS

    client_max_body_size 50m;    # Excel/附件上传

    # 前端静态资源（构建产物挂载路径按实际调整）
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://app:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # AI SSE：必须关闭缓冲，否则流式输出会被攒包
    location /ai/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # WebSocket
    location /socket.io/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}

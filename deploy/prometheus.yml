# Prometheus 抓取配置（应用机 + 数据库机 exporter）
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node            # 应用机
    static_configs: [{ targets: ['app:9100'] }]
  - job_name: postgres        # 数据库机 postgres_exporter
    static_configs: [{ targets: ['db-primary.internal:9187'] }]
  - job_name: redis
    static_configs: [{ targets: ['redis:9121'] }]

# 告警规则（关键指标见方案 v3.0 第五章）：
# API p95 > 500ms / 5xx 率 > 1% / WS 连接骤降 / PG 慢查询 > 1s / 磁盘 > 80%
